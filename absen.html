<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Absensi Harian</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 16px 36px;
      background: #f3f4f6;
      color: #111827;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h2 { margin: 0 0 6px; font-size: 20px; }
    .clock {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 16px;
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      color: #374151;
    }
    select, input, textarea {
      width: 100%;
      padding: 11px 12px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:active { transform: scale(0.99); background: #15803d; }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .btn-copy {
      background: #111827;
      margin-top: 10px;
    }
    .btn-copy:active { background: #1f2937; }
    .alert {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    .alert.success { display: block; background: #dcfce7; color: #166534; }
    .alert.error { display: block; background: #fee2e2; color: #991b1b; }
    .wa-box {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
      display: none;
    }
    .wa-box textarea {
      font-size: 13.5px;
      background: #f9fafb;
      line-height: 1.45;
      resize: none;
    }
    .copy-status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #15803d;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Absensi Shift Harian</h2>
    <div id="liveClock" class="clock">Memuat waktu...</div>

    <form id="absenForm" onsubmit="kirimAbsen(event)">
      <label>Nama</label>
      <select id="nama" required>
        <option value="">-- Pilih Nama --</option>
        <option value="Eca">Eca</option>
        <option value="Iki">Iki</option>
        <option value="Diza">Diza</option>
        <option value="Ryan">Ryan</option>
        <option value="Trio">Trio</option>
      </select>

      <label>Shift</label>
      <select id="shift" required>
        <option value="Shift 1 (Pagi)">Shift 1 (Pagi)</option>
        <option value="Shift 2 (Sore)">Shift 2 (Sore)</option>
        <option value="Full Shift">Full Shift</option>
      </select>

      <label>Status Kehadiran</label>
      <select id="status" required>
        <option value="Masuk">Masuk</option>
        <option value="Pulang">Pulang</option>
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
      </select>

      <label>Catatan (Opsional)</label>
      <input id="catatan" type="text" placeholder="Contoh: Ganti shift / telat 10 menit" />

      <button type="submit" id="btnSubmit">Kirim Absensi</button>
    </form>

    <div id="notif" class="alert"></div>

    <div id="waSection" class="wa-box">
      <label style="margin-top: 0;">Teks Konfirmasi untuk Grup WA</label>
      <textarea id="waText" rows="6" readonly></textarea>
      <button type="button" class="btn-copy" onclick="salinWa()">Salin Teks ke Grup WA</button>
      <div id="copyStatus" class="copy-status"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "PASTE_URL_WEB_APP_ANDA_DI_SINI";

    function updateClock() {
      const now = new Date();
      document.getElementById("liveClock").textContent = now.toLocaleString("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }) + " WIB";
    }
    setInterval(updateClock, 1000);
    updateClock();

    function buatTeksWa(payload, waktuStr) {
      const barisCatatan = payload.catatan ? `\nCatatan: ${payload.catatan}` : "";
      return `*ABSENSI SHIFT*
Nama: ${payload.nama}
Shift: ${payload.shift}
Status: ${payload.status}
Waktu: ${waktuStr} WIB${barisCatatan}`;
    }

    async function kirimAbsen(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const notif = document.getElementById("notif");
      const waSection = document.getElementById("waSection");
      const copyStatus = document.getElementById("copyStatus");

      const now = new Date();
      const waktuStr = now.toLocaleString("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

      const payload = {
        nama: document.getElementById("nama").value,
        shift: document.getElementById("shift").value,
        status: document.getElementById("status").value,
        catatan: document.getElementById("catatan").value.trim()
      };

      btn.disabled = true;
      btn.textContent = "Menyimpan...";
      notif.className = "alert";
      notif.style.display = "none";
      copyStatus.textContent = "";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        notif.textContent = `Berhasil! Absen ${payload.status} untuk ${payload.nama} tercatat.`;
        notif.className = "alert success";

        document.getElementById("waText").value = buatTeksWa(payload, waktuStr);
        waSection.style.display = "block";
        document.getElementById("catatan").value = "";
      } catch (err) {
        notif.textContent = "Gagal mengirim data. Periksa koneksi internet Anda.";
        notif.className = "alert error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirim Absensi";
      }
    }

    async function salinWa() {
      const el = document.getElementById("waText");
      const statusEl = document.getElementById("copyStatus");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(el.value);
        } else {
          el.select();
          el.setSelectionRange(0, el.value.length);
          document.execCommand("copy");
        }
        statusEl.textContent = "Teks absensi tersalin! Siap paste di grup WA.";
      } catch (err) {
        el.select();
        el.setSelectionRange(0, el.value.length);
        statusEl.textContent = "Teks diblok, silakan tekan Salin.";
      }
      setTimeout(() => { statusEl.textContent = ""; }, 3000);
    }
  </script>
</body>
</html>
